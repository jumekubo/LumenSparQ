<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<title>LMS Book Club — Shelf by Shelf</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
  }

  .container {
    width: 100%;
    max-width: 680px;
  }

  .header {
    text-align: center;
    margin-bottom: 30px;
  }

  .header h1 {
    font-family: 'DM Serif Display', serif;
    color: #f5e6d0;
    font-size: 2.2em;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }

  .header .subtitle {
    color: #c9a96e;
    font-size: 0.95em;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .header .org {
    color: #7a8ba6;
    font-size: 0.8em;
    margin-top: 8px;
    letter-spacing: 0.5px;
  }

  .progress-display {
    text-align: center;
    margin-bottom: 24px;
  }

  .amount-raised {
    font-family: 'DM Serif Display', serif;
    font-size: 3em;
    color: #c9a96e;
    line-height: 1;
  }

  .goal-text {
    color: #7a8ba6;
    font-size: 0.95em;
    margin-top: 6px;
  }

  .percent-text {
    color: #f5e6d0;
    font-size: 1.1em;
    font-weight: 700;
    margin-top: 4px;
  }

  .bookshelf-wrapper {
    background: linear-gradient(180deg, #16213e 0%, #1a1a2e 100%);
    border-radius: 16px;
    padding: 30px 24px 20px;
    margin-bottom: 24px;
    border: 1px solid #2a2a4a;
  }

  .shelf {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    height: 110px;
    padding: 0;
    margin-bottom: 0;
    position: relative;
  }

  .shelf-board {
    width: 100%;
    height: 12px;
    background: linear-gradient(180deg, #8B6914, #6B4F12, #5a4210);
    border-radius: 2px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    margin-bottom: 16px;
    position: relative;
  }

  .book {
    flex: 1;
    margin: 0 1px;
    border-radius: 3px 3px 1px 1px;
    position: relative;
    transition: height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
    opacity: 0;
    height: 0;
    cursor: default;
    box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
    min-width: 0;
    overflow: hidden;
  }

  .book.visible {
    opacity: 1;
  }

  .book .spine {
    position: absolute;
    left: 0;
    top: 0;
    width: 4px;
    height: 100%;
    background: rgba(0,0,0,0.15);
    border-radius: 3px 0 0 1px;
  }

  .book .book-title {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-90deg);
    white-space: nowrap;
    font-family: 'DM Sans', sans-serif;
    font-size: 6.5px;
    font-weight: 700;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    pointer-events: none;
    text-shadow: 0 0 2px rgba(0,0,0,0.4);
    max-width: none;
    overflow: hidden;
    text-overflow: clip;
  }

  .book .book-band-top,
  .book .book-band-bottom {
    position: absolute;
    left: 0;
    width: 100%;
    height: 2px;
    background: rgba(255,255,255,0.12);
  }

  .book .book-band-top { top: 6px; }
  .book .book-band-bottom { bottom: 6px; }

  .progress-bar-container {
    width: 100%;
    height: 8px;
    background: #2a2a4a;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 8px;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #c9a96e, #e8c87a);
    border-radius: 4px;
    transition: width 0.8s ease;
    width: 0%;
  }

  .input-area {
    background: #16213e;
    border-radius: 12px;
    padding: 20px 24px;
    border: 1px solid #2a2a4a;
    margin-bottom: 24px;
  }

  .input-area label {
    color: #7a8ba6;
    font-size: 0.85em;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: block;
    margin-bottom: 10px;
  }

  .input-row {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .input-row .dollar-sign {
    color: #c9a96e;
    font-family: 'DM Serif Display', serif;
    font-size: 1.6em;
  }

  .input-row input {
    flex: 1;
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 8px;
    padding: 12px 16px;
    color: #f5e6d0;
    font-family: 'DM Sans', sans-serif;
    font-size: 1.4em;
    font-weight: 700;
    outline: none;
    transition: border-color 0.3s;
  }

  .input-row input:focus {
    border-color: #c9a96e;
  }

  .input-row input::placeholder {
    color: #3a3a5a;
  }

  .input-row button {
    background: linear-gradient(135deg, #c9a96e, #b8953e);
    color: #1a1a2e;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1em;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .input-row button:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(201, 169, 110, 0.3);
  }

  .milestones {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
  }

  .milestone {
    text-align: center;
    flex: 1;
  }

  .milestone .milestone-amount {
    color: #3a3a5a;
    font-size: 0.85em;
    font-weight: 700;
    transition: color 0.4s;
  }

  .milestone .milestone-label {
    color: #3a3a5a;
    font-size: 0.7em;
    margin-top: 2px;
    transition: color 0.4s;
  }

  .milestone.reached .milestone-amount {
    color: #c9a96e;
  }

  .milestone.reached .milestone-label {
    color: #7a8ba6;
  }

  .footer {
    text-align: center;
    color: #3a3a5a;
    font-size: 0.75em;
    margin-top: 10px;
  }

  .footer a {
    color: #7a8ba6;
    text-decoration: none;
  }

  .celebration {
    display: none;
    text-align: center;
    padding: 16px;
    background: linear-gradient(135deg, rgba(201,169,110,0.15), rgba(201,169,110,0.05));
    border: 1px solid #c9a96e;
    border-radius: 12px;
    margin-bottom: 20px;
  }

  .celebration.show {
    display: block;
    animation: fadeIn 0.6s ease;
  }

  .celebration h3 {
    font-family: 'DM Serif Display', serif;
    color: #c9a96e;
    font-size: 1.4em;
    margin-bottom: 4px;
  }

  .celebration p {
    color: #f5e6d0;
    font-size: 0.9em;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .screenshot-btn {
    background: none;
    border: 1px solid #2a2a4a;
    color: #7a8ba6;
    padding: 8px 16px;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8em;
    cursor: pointer;
    margin-top: 12px;
    transition: all 0.3s;
  }

  .screenshot-btn:hover {
    border-color: #7a8ba6;
    color: #f5e6d0;
  }

  body.screenshot-mode .input-area,
  body.screenshot-mode .screenshot-btn,
  body.screenshot-mode .footer {
    display: none;
  }

  body.screenshot-mode {
    padding: 40px 20px;
  }

  body.screenshot-mode .bookshelf-wrapper {
    margin-bottom: 0;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Shelf by Shelf</h1>
    <div class="subtitle">LMS Book Club Fundraiser</div>
    <div class="org">Presented by LumenSparQ</div>
  </div>

  <div class="celebration" id="celebration">
    <h3 id="celebrationTitle">Goal Reached!</h3>
    <p id="celebrationText">The shelf is full. Thank you for supporting the LMS Book Club.</p>
  </div>

  <div class="progress-display">
    <div class="amount-raised" id="amountDisplay">$0</div>
    <div class="goal-text">raised of <strong>$3,000</strong> goal</div>
    <div class="percent-text" id="percentDisplay">0%</div>
  </div>

  <div class="bookshelf-wrapper">
    <div class="shelf" id="shelf-top"></div>
    <div class="shelf-board"></div>
    <div class="shelf" id="shelf-middle"></div>
    <div class="shelf-board"></div>
    <div class="shelf" id="shelf-bottom"></div>
    <div class="shelf-board"></div>

    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>

    <div class="milestones">
      <div class="milestone" id="m1">
        <div class="milestone-amount">$750</div>
        <div class="milestone-label">25%</div>
      </div>
      <div class="milestone" id="m2">
        <div class="milestone-amount">$1,500</div>
        <div class="milestone-label">50%</div>
      </div>
      <div class="milestone" id="m3">
        <div class="milestone-amount">$2,250</div>
        <div class="milestone-label">75%</div>
      </div>
      <div class="milestone" id="m4">
        <div class="milestone-amount">$3,000</div>
        <div class="milestone-label">100%</div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <label>Amount Raised</label>
    <div class="input-row">
      <span class="dollar-sign">$</span>
      <input type="number" id="amountInput" placeholder="0" min="0" max="10000" step="1">
      <button onclick="updateShelf()">Update</button>
    </div>
  </div>

  <div style="text-align: center;">
    <button class="screenshot-btn" onclick="toggleScreenshotMode()">Screenshot Mode (or press S)</button>
  </div>

  <div class="footer">
    <p>lumensparq.org | <a href="https://lumensparq.org/donate/">Donate</a></p>
  </div>
</div>

<script>
  const GOAL = 3000;
  const TOTAL_BOOKS = 36;
  const BOOKS_PER_SHELF = 12;

  const bookTitles = [
    // Shelf 1 (bottom)
    "The Hate U Give",
    "Speak",
    "The Outsiders",
    "Esperanza Rising",
    "Brown Girl Dreaming",
    "The House on Mango Street",
    "Starfish",
    "Long Way Down",
    "Ghost",
    "New Kid",
    "Piecing Me Together",
    "The Crossover",
    // Shelf 2 (middle)
    "Dear Martin",
    "Clap When You Land",
    "The Sun Is Also a Star",
    "I Am Not Your Perfect Mexican Daughter",
    "American Street",
    "With the Fire on High",
    "Pet",
    "Patron Saints of Nothing",
    "Front Desk",
    "Merci Suarez Changes Gears",
    "The First Rule of Punk",
    "They Called Us Enemy",
    // Shelf 3 (top)
    "When You Trap a Tiger",
    "Genesis Begins Again",
    "Look Both Ways",
    "Harbor Me",
    "Amal Unbound",
    "Internment",
    "The Parker Inheritance",
    "A Good Kind of Trouble",
    "Aristotle and Dante",
    "Cemetery Boys",
    "Felix Ever After",
    "We Are Not Free"
  ];

  const bookColors = [
    '#8B4513', '#A0522D', '#CD853F', '#D2691E', '#B8860B',
    '#1B4F72', '#2E86C1', '#1A5276', '#154360', '#1F618D',
    '#7D3C98', '#6C3483', '#5B2C6F', '#4A235A',
    '#C0392B', '#E74C3C', '#CB4335',
    '#1E8449', '#27AE60', '#229954', '#196F3D',
    '#C9A96E', '#B8953E', '#A07828',
    '#2C3E50', '#34495E', '#2C3E50',
    '#884EA0', '#7D6608', '#935116',
    '#1B2631', '#4A4A6A', '#6B4226',
    '#2E4053', '#7B241C', '#1A5276', '#196F3D'
  ];

  const bookHeights = [];
  for (let i = 0; i < TOTAL_BOOKS; i++) {
    bookHeights.push(65 + Math.random() * 30);
  }

  function createBooks() {
    const shelves = ['shelf-bottom', 'shelf-middle', 'shelf-top'];
    shelves.forEach((shelfId, shelfIdx) => {
      const shelf = document.getElementById(shelfId);
      for (let i = 0; i < BOOKS_PER_SHELF; i++) {
        const bookIdx = shelfIdx * BOOKS_PER_SHELF + i;
        const book = document.createElement('div');
        book.className = 'book';
        book.id = `book-${bookIdx}`;
        book.style.backgroundColor = bookColors[bookIdx % bookColors.length];
        book.style.flexGrow = (0.7 + Math.random() * 0.6).toFixed(2);

        const spine = document.createElement('div');
        spine.className = 'spine';
        book.appendChild(spine);

        const bandTop = document.createElement('div');
        bandTop.className = 'book-band-top';
        book.appendChild(bandTop);

        const bandBottom = document.createElement('div');
        bandBottom.className = 'book-band-bottom';
        book.appendChild(bandBottom);

        const title = document.createElement('div');
        title.className = 'book-title';
        // Truncate long titles to fit shorter books
        const maxChars = Math.floor(bookHeights[bookIdx] / 4.5);
        const fullTitle = bookTitles[bookIdx];
        title.textContent = fullTitle.length > maxChars ? fullTitle.substring(0, maxChars - 1).trim() + '...' : fullTitle;
        title.setAttribute('data-full-title', fullTitle);
        book.appendChild(title);

        shelf.appendChild(book);
      }
    });
  }

  function updateShelf() {
    const input = document.getElementById('amountInput');
    let amount = parseFloat(input.value) || 0;
    if (amount < 0) amount = 0;
    if (amount > GOAL * 2) amount = GOAL * 2;

    const percent = Math.min(amount / GOAL, 1);
    const booksToShow = Math.round(percent * TOTAL_BOOKS);

    document.getElementById('amountDisplay').textContent = '$' + amount.toLocaleString();
    if (amount > GOAL) {
      const over = amount - GOAL;
      document.getElementById('percentDisplay').textContent = Math.round(percent * 100) + '% — $' + over.toLocaleString() + ' beyond goal!';
    } else {
      document.getElementById('percentDisplay').textContent = Math.round(percent * 100) + '%';
    }
    document.getElementById('progressBar').style.width = (percent * 100) + '%';

    for (let i = 0; i < TOTAL_BOOKS; i++) {
      const book = document.getElementById(`book-${i}`);
      if (i < booksToShow) {
        setTimeout(() => {
          book.classList.add('visible');
          book.style.height = bookHeights[i] + 'px';
        }, i * 60);
      } else {
        book.classList.remove('visible');
        book.style.height = '0px';
      }
    }

    document.getElementById('m1').classList.toggle('reached', amount >= 750);
    document.getElementById('m2').classList.toggle('reached', amount >= 1500);
    document.getElementById('m3').classList.toggle('reached', amount >= 2250);
    document.getElementById('m4').classList.toggle('reached', amount >= 3000);

    const cel = document.getElementById('celebration');
    const celTitle = document.getElementById('celebrationTitle');
    const celText = document.getElementById('celebrationText');
    if (amount >= GOAL) {
      cel.classList.add('show');
      if (amount > GOAL) {
        const over = amount - GOAL;
        celTitle.textContent = 'Beyond the Goal!';
        celText.textContent = 'The shelf is overflowing. $' + over.toLocaleString() + ' more for the LMS Book Club. Thank you!';
      } else {
        celTitle.textContent = 'Goal Reached!';
        celText.textContent = 'The shelf is full. Thank you for supporting the LMS Book Club.';
      }
    } else {
      cel.classList.remove('show');
    }
  }

  function toggleScreenshotMode() {
    document.body.classList.toggle('screenshot-mode');
  }

  document.getElementById('amountInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') updateShelf();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 's' || e.key === 'S') {
      if (document.activeElement !== document.getElementById('amountInput')) {
        toggleScreenshotMode();
      }
    }
    if (e.key === 'Escape') {
      document.body.classList.remove('screenshot-mode');
    }
  });

  createBooks();
</script>

</body>
</html>
